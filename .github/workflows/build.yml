name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: RomaToHiragana.csproj
  RID: win-x64

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: dotnet restore "$env:PROJECT"

      - name: Build (Debug)
        run: dotnet build "$env:PROJECT" -c Debug --no-restore

      - name: Test
        run: |
          dotnet restore "Tests\RomaToHiragana.Tests.csproj"
          dotnet test "Tests\RomaToHiragana.Tests.csproj" -c Debug --no-restore

      - name: Publish (Release, ${{ env.RID }})
        run: |
          dotnet publish "$env:PROJECT" -c Release -r "$env:RID" --self-contained true /p:PublishSingleFile=true -o "artifacts"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RomaToHiragana-${{ env.RID }}-release
          path: artifacts/
          if-no-files-found: error
